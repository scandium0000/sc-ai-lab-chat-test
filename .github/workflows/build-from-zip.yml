
name: Sc Chat Android Build

'on':
  workflow_dispatch:
  push:
    paths:
      - 'ScChat_0.9.0_ReasoningEngine.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Sc Chat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract project
        run: |
          test -f ScChat_0.9.0_ReasoningEngine.zip
          mkdir extracted
          unzip -q ScChat_0.9.0_ReasoningEngine.zip -d extracted
          test -f extracted/ScChat_Android/settings.gradle.kts

      - name: Validate JavaScript
        working-directory: extracted/ScChat_Android
        run: |
          node --check app/src/main/assets/app.js
          node tests/provider-logic.test.cjs
          node tests/ui-regression.test.cjs
          node tests/lifecycle-regression.test.cjs
          node tests/auth-resume.test.cjs
          node tests/reasoning-mode.test.cjs
          node tests/reasoning-engine.test.cjs
          python tests/validate-assets.py

      - name: Build debug APK
        run: |
          gradle -p extracted/ScChat_Android :app:assembleDebug

      - name: Verify APK
        run: |
          APK="extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScChat-0.9.0-debug
          path: extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
