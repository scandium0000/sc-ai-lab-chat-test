
name: Build Sc Ai Lab Chat 0.4.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ScAiLabChat_0.4.0.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q ScAiLabChat_0.4.0.zip -d extracted
          test -f extracted/ScAiLabChat_Prototype/settings.gradle.kts
          test -f extracted/ScAiLabChat_Prototype/app/src/main/java/ai/scailab/chat/MainActivity.java

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p extracted/ScAiLabChat_Prototype \
            :app:assembleDebug

      - name: Verify APK and signature
        run: |
          APK="extracted/ScAiLabChat_Prototype/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          head -n 3 /tmp/apk-badging.txt
          cp "$APK" app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScAiLabChat-0.4.0-debug
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 14
