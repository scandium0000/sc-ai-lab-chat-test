
name: Build Sc Ai Lab Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ScAiLabChat_ClaudeStyle_v3.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Checking Android SDK..."
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q ScAiLabChat_ClaudeStyle_v3.zip -d extracted
          test -f extracted/ScAiLabChat_Prototype/settings.gradle.kts
          echo "Project extracted successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p extracted/ScAiLabChat_Prototype \
            :app:assembleDebug

      - name: Verify APK
        run: |
          APK="extracted/ScAiLabChat_Prototype/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" app-debug.apk
          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScAiLabChat-0.2.0-debug
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 14
