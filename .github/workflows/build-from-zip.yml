
name: Sc Chat Android Build

'on':
  workflow_dispatch:
  push:
    paths:
      - 'ScChat_0.9.0_ReasoningEngine.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Sc Chat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Initialize Android SDK command-line tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Install SDK packages individually
      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --version

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Extract project ZIP
      - name: Extract project
        run: |
          set -e

          ZIP_FILE="ScChat_0.9.0_ReasoningEngine.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/ScChat_Android/settings.gradle.kts" ]; then
            echo "ERROR: Project directory structure is invalid."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Project extraction completed."

      # Run project validation and regression tests
      - name: Run project tests
        working-directory: extracted/ScChat_Android
        run: |
          set -e

          node --check app/src/main/assets/app.js

          node tests/provider-logic.test.cjs
          node tests/ui-regression.test.cjs
          node tests/lifecycle-regression.test.cjs
          node tests/auth-resume.test.cjs
          node tests/reasoning-mode.test.cjs
          node tests/reasoning-engine.test.cjs

          python tests/validate-assets.py

          echo "All tests passed."

      # Build Android APK
      - name: Build Debug APK
        run: |
          set -e

          gradle \
            -p extracted/ScChat_Android \
            :app:assembleDebug \
            --no-daemon

      # Verify generated APK
      - name: Verify APK
        run: |
          set -e

          APK="extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScChat-0.9.0-debug
          path: extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
