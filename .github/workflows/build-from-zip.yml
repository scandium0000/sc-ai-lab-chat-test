
name: Sc Chat Android Build

'on':
  workflow_dispatch:
  push:
    paths:
      - 'ScChat_0.9.0_ReasoningEngine.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Sc Chat APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 5. Initialize Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # 6. Install required Android SDK components
      - name: Install Android SDK packages
        run: |
          set -e

          echo "Checking SDK Manager..."
          sdkmanager --version

          echo "Installing Android API 35..."
          sdkmanager --install "platforms;android-35"

          echo "Installing Android Build Tools 35.0.0..."
          sdkmanager --install "build-tools;35.0.0"

          echo "Installed SDK packages:"
          sdkmanager --list_installed

      # 7. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Extract project ZIP
      - name: Extract project
        run: |
          set -e

          ZIP_FILE="ScChat_0.9.0_ReasoningEngine.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/ScChat_Android/settings.gradle.kts" ]; then
            echo "ERROR: Invalid project directory structure."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Project extraction completed."

      # 9. Validate JavaScript and project assets
      - name: Run project tests
        working-directory: extracted/ScChat_Android
        run: |
          set -e

          node --check app/src/main/assets/app.js

          node tests/provider-logic.test.cjs
          node tests/ui-regression.test.cjs
          node tests/lifecycle-regression.test.cjs
          node tests/auth-resume.test.cjs
          node tests/reasoning-mode.test.cjs
          node tests/reasoning-engine.test.cjs

          python tests/validate-assets.py

          echo "All project tests passed."

      # 10. Build Android APK
      - name: Build Debug APK
        run: |
          set -e

          gradle \
            -p extracted/ScChat_Android \
            :app:assembleDebug \
            --no-daemon

      # 11. Verify APK
      - name: Verify APK
        run: |
          set -e

          APK="extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScChat-0.9.0-debug
          path: extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
