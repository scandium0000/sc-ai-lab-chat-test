
name: Build Sc Chat 0.9.4 APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'ScChat_0.9.4_DocumentOfficeOCR.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Sc Chat 0.9.4
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "ERROR: Android cmdline-tools directory not found: $SDK_ROOT/cmdline-tools"
            find /usr/local/lib/android -maxdepth 5 -type d 2>/dev/null | head -100 || true
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Could not locate an executable sdkmanager under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="ScChat_0.9.4_DocumentOfficeOCR.zip"
          test -s "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          ROOT="extracted/ScChat_Android"
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/app/src/main/java/ai/scailab/chat/MainActivity.java"
          test -f "$ROOT/app/src/main/java/ai/scailab/chat/DocxDocumentParser.java"
          test -f "$ROOT/app/src/main/java/ai/scailab/chat/StructuredDocumentParser.java"
          test -f "$ROOT/app/src/main/java/ai/scailab/chat/ArchiveDocumentParser.java"
          test -f "$ROOT/app/src/main/assets/document-engine.js"
          test -f "$ROOT/tests/java/ai/scailab/chat/StructuredDocumentParserTest.java"
          test -f "$ROOT/tests/generated-file-links.test.cjs"

      - name: Run JavaScript regression tests
        working-directory: extracted/ScChat_Android
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/document-engine.js
          node --check app/src/main/assets/camera-studio.js
          for test_file in tests/*.test.cjs; do
            echo "Running $test_file"
            node "$test_file"
          done
          python3 tests/validate-assets.py

      - name: Compile and run local document parser tests
        working-directory: extracted/ScChat_Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scchat-document-tests
          javac -encoding UTF-8 -d /tmp/scchat-document-tests \
            app/src/main/java/ai/scailab/chat/DocxContentHandler.java \
            app/src/main/java/ai/scailab/chat/DocxDocumentParser.java \
            app/src/main/java/ai/scailab/chat/StructuredDocumentParser.java \
            app/src/main/java/ai/scailab/chat/ArchiveDocumentParser.java \
            tests/java/ai/scailab/chat/DocxContentHandlerTest.java \
            tests/java/ai/scailab/chat/StructuredDocumentParserTest.java
          java -cp /tmp/scchat-document-tests ai.scailab.chat.DocxContentHandlerTest
          java -cp /tmp/scchat-document-tests ai.scailab.chat.StructuredDocumentParserTest

      - name: Validate Android XML
        working-directory: extracted/ScChat_Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in [
              Path('app/src/main/AndroidManifest.xml'),
              Path('app/src/main/res/values/styles.xml'),
              Path('app/src/main/res/values-night/styles.xml'),
              Path('app/src/main/res/xml/file_paths.xml'),
          ]:
              ET.parse(path)
              print(f'XML OK: {path}')
          PY

      - name: Build Debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p extracted/ScChat_Android \
            :app:assembleDebug

      - name: Verify APK package, version, and signature
        run: |
          set -euo pipefail
          APK="extracted/ScChat_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/scchat-apk-badging.txt
          grep -q "package: name='ai.scailab.chat'" /tmp/scchat-apk-badging.txt
          grep -q "versionCode='18'" /tmp/scchat-apk-badging.txt
          grep -q "versionName='0.9.4'" /tmp/scchat-apk-badging.txt
          mkdir -p artifacts
          cp "$APK" artifacts/ScChat-0.9.4-debug.apk
          ls -lh artifacts/ScChat-0.9.4-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScChat-0.9.4-debug
          path: artifacts/ScChat-0.9.4-debug.apk
          if-no-files-found: error
          retention-days: 14

